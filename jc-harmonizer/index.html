<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonizer PoC</title>
  <style>
    body { background: #0d0d1a; color: #eee; font-family: 'Courier New', Courier, monospace; padding: 24px; line-height: 1.7; }
    button { font: inherit; padding: 8px 20px; cursor: pointer; }
    .row { margin: 8px 0; }
    .value { color: #8fd48f; }
    label { display: inline-block; width: 6em; }
    small { color: #888; }
    #keyboard { position: relative; height: 140px; margin-top: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
    .key { position: absolute; top: 0; box-sizing: border-box; border: 1px solid #333; border-radius: 0 0 4px 4px; }
    .key.white { height: 100%; background: #eee; }
    .key.black { height: 60%; background: #222; z-index: 1; }
    .key.on { background: #8fd48f; }
    .fx { border: 1px solid #444; border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
    .fx.off { opacity: 0.5; }
    .fx header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .fx header strong { margin-right: auto; }
    .fx button { padding: 2px 10px; }
    .fx textarea { width: 100%; box-sizing: border-box; height: 14em; background: #111; color: #eee; font: 12px/1.5 monospace; tab-size: 2; }
    .fx .error { color: #ff7070; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Harmonizer PoC</h1>
  <p><small>イヤホン/ヘッドホン推奨 (スピーカーだとハウリングします)。MIDI が無ければ下の鍵盤 (スマホはマルチタッチで和音可) か、PC キーボード A W S E D F T G Y H U J K で C4〜C5。</small></p>
  <div class="row"><button id="start">Start</button></div>
  <div class="row">状態: <span class="value" id="status">停止中</span></div>
  <div class="row">MIDI: <span class="value" id="midi">-</span></div>
  <div class="row">入力ピッチ: <span class="value" id="pitch">-</span></div>
  <div class="row">ノート: <span class="value" id="notes">-</span></div>
  <div class="row">遅延 (ブラウザ報告値): <span class="value" id="latency">-</span></div>
  <div class="row"><label>Dry</label><input id="dry" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="row"><label>Wet</label><input id="wet" type="range" min="0" max="1" step="0.01" value="1"></div>
  <div class="row"><button id="octDown">◀</button> <span id="range"></span> <button id="octUp">▶</button></div>
  <div id="keyboard"></div>

  <h2>エフェクト</h2>
  <p><small>ハーモナイザーの後ろに上から順にかかります。Start してから追加してください。</small></p>
  <div class="row"><select id="fxType"></select> <button id="fxAdd" disabled>追加</button></div>
  <div id="chain"></div>

  <script src="effects.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const noteName = (n) => NAMES[n % 12] + (Math.floor(n / 12) - 1);
    const held = new Set();
    let ctx, node;

    const keyEls = new Map(); // note -> 画面鍵盤の要素
    function showKey(note, on) {
      const el = keyEls.get(note);
      if (el) el.classList.toggle("on", on);
    }

    function noteOn(note, velocity) {
      if (!node) return;
      held.add(note);
      showKey(note, true);
      node.port.postMessage({ type: "noteOn", note, velocity });
      $("notes").textContent = [...held].sort((a, b) => a - b).map(noteName).join(" ") || "-";
    }
    function noteOff(note) {
      if (!node) return;
      held.delete(note);
      showKey(note, false);
      node.port.postMessage({ type: "noteOff", note });
      $("notes").textContent = [...held].sort((a, b) => a - b).map(noteName).join(" ") || "-";
    }
    function sendParams() {
      if (node) node.port.postMessage({ type: "params", dry: +$("dry").value, wet: +$("wet").value });
    }

    $("start").onclick = async () => {
      $("start").disabled = true;
      // latencyHint: 0 で、ブラウザが許す最小のバッファサイズを要求する
      ctx = new AudioContext({ latencyHint: 0 });
      // iOS Safari はユーザー操作の中で resume しないと音が出ない
      ctx.resume();
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1, latency: 0 },
        });
      } catch (e) {
        $("status").textContent = `マイクを使えません (${e.message})`;
        $("start").disabled = false;
        return;
      }
      await ctx.audioWorklet.addModule("harmonizer-worklet.js");
      await ctx.audioWorklet.addModule("code-effect-worklet.js");
      chainIn = ctx.createGain();
      chainOut = ctx.createGain();
      chainOut.connect(ctx.destination);
      rewire();
      $("fxAdd").disabled = false;
      node = new AudioWorkletNode(ctx, "harmonizer", { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
      node.port.onmessage = (e) => {
        if (e.data.type === "pitch") $("pitch").textContent = e.data.hz ? `${e.data.hz.toFixed(1)} Hz` : "-";
      };
      ctx.createMediaStreamSource(stream).connect(node).connect(chainIn);
      sendParams();

      $("status").textContent = `動作中 (${ctx.sampleRate} Hz)`;
      const showLatency = () => {
        const base = ctx.baseLatency * 1000;
        const output = (ctx.outputLatency || 0) * 1000;
        $("latency").textContent = `base ${base.toFixed(1)}ms + output ${output.toFixed(1)}ms (+ 入力側とピッチシフト分)`;
      };
      showLatency();
      setInterval(showLatency, 1000);

      if (!navigator.requestMIDIAccess) {
        $("midi").textContent = "このブラウザは Web MIDI 非対応 (画面の鍵盤を使ってください)";
        return;
      }
      let access;
      try {
        access = await navigator.requestMIDIAccess();
      } catch (e) {
        $("midi").textContent = `使用不可 (${e.message})`;
        return;
      }
      const bind = () => {
        const names = [];
        for (const input of access.inputs.values()) {
          names.push(input.name);
          input.onmidimessage = ({ data }) => {
            const [status, note, velocity] = data;
            const cmd = status & 0xf0;
            if (cmd === 0x90 && velocity > 0) noteOn(note, velocity);
            else if (cmd === 0x80 || (cmd === 0x90 && velocity === 0)) noteOff(note);
          };
        }
        $("midi").textContent = names.join(", ") || "入力デバイスなし";
      };
      bind();
      access.onstatechange = bind;
    };

    const KEYS = "awsedftgyhujk";
    addEventListener("keydown", (e) => {
      const i = KEYS.indexOf(e.key);
      if (i >= 0 && !e.repeat) noteOn(60 + i, 100);
    });
    addEventListener("keyup", (e) => {
      const i = KEYS.indexOf(e.key);
      if (i >= 0) noteOff(60 + i);
    });
    $("dry").oninput = $("wet").oninput = sendParams;

    // 画面鍵盤 (2 オクターブ)。Pointer Events なのでマウスでもマルチタッチでも動き、指を滑らせると隣の鍵盤に移る。
    let lowNote = 48;
    const pointers = new Map(); // pointerId -> note
    function buildKeyboard() {
      const kb = $("keyboard");
      for (const note of pointers.values()) noteOff(note);
      pointers.clear();
      kb.innerHTML = "";
      keyEls.clear();
      const whiteWidth = 100 / 14;
      let white = 0;
      for (let note = lowNote; note < lowNote + 24; note++) {
        const black = NAMES[note % 12].includes("#");
        const el = document.createElement("div");
        el.className = `key ${black ? "black" : "white"}`;
        el.dataset.note = note;
        el.style.left = `${(black ? white - 0.3 : white) * whiteWidth}%`;
        el.style.width = `${(black ? 0.6 : 1) * whiteWidth}%`;
        if (!black) white++;
        if (held.has(note)) el.classList.add("on");
        kb.append(el);
        keyEls.set(note, el);
      }
      $("range").textContent = `${noteName(lowNote)}〜${noteName(lowNote + 23)}`;
    }
    const noteAt = (x, y) => {
      const el = document.elementFromPoint(x, y);
      return el && el.dataset.note ? +el.dataset.note : null;
    };
    $("keyboard").addEventListener("pointerdown", (e) => {
      const note = noteAt(e.clientX, e.clientY);
      if (note === null) return;
      $("keyboard").setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, note);
      noteOn(note, 100);
    });
    $("keyboard").addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      const note = noteAt(e.clientX, e.clientY);
      const prev = pointers.get(e.pointerId);
      if (note === null || note === prev) return;
      pointers.set(e.pointerId, note);
      noteOff(prev);
      noteOn(note, 100);
    });
    const release = (e) => {
      if (!pointers.has(e.pointerId)) return;
      noteOff(pointers.get(e.pointerId));
      pointers.delete(e.pointerId);
    };
    $("keyboard").addEventListener("pointerup", release);
    $("keyboard").addEventListener("pointercancel", release);
    $("octDown").onclick = () => { lowNote = Math.max(24, lowNote - 12); buildKeyboard(); };
    $("octUp").onclick = () => { lowNote = Math.min(84, lowNote + 12); buildKeyboard(); };
    buildKeyboard();

    // エフェクトチェーン: harmonizer → chainIn → [エフェクト...] → chainOut → スピーカー
    let chainIn, chainOut;
    const chain = []; // { fx, enabled, el }
    const PRESET_KEY = "jc-harmonizer.codePresets";
    const loadPresets = () => {
      try {
        return JSON.parse(localStorage.getItem(PRESET_KEY)) || {};
      } catch {
        return {};
      }
    };
    const savePresets = (presets) => {
      try {
        localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
      } catch {}
    };

    function rewire() {
      chainIn.disconnect();
      for (const slot of chain) slot.fx.output.disconnect();
      let last = chainIn;
      for (const slot of chain) {
        if (!slot.enabled) continue;
        last.connect(slot.fx.input);
        last = slot.fx.output;
      }
      last.connect(chainOut);
      $("chain").replaceChildren(...chain.map((s) => s.el));
    }

    function fillFxTypes() {
      const options = Object.entries(EFFECTS).map(([key, def]) => new Option(def.label, key));
      for (const name of Object.keys(loadPresets())) options.push(new Option(`自作: ${name}`, `preset:${name}`));
      $("fxType").replaceChildren(...options);
    }

    function addEffect(value) {
      let type = value, opts = {}, title;
      if (value.startsWith("preset:")) {
        title = value.slice(7);
        type = "code";
        opts = { source: loadPresets()[title] };
      }
      const fx = EFFECTS[type].create(ctx, opts);
      const slot = { fx, enabled: true, el: document.createElement("div") };
      slot.el.className = "fx";

      const header = document.createElement("header");
      const name = document.createElement("strong");
      name.textContent = title || EFFECTS[type].label;
      const onOff = document.createElement("input");
      onOff.type = "checkbox";
      onOff.checked = true;
      onOff.onchange = () => {
        slot.enabled = onOff.checked;
        slot.el.classList.toggle("off", !slot.enabled);
        rewire();
      };
      const onLabel = document.createElement("label");
      onLabel.append(onOff, " ON");
      const move = (d) => () => {
        const i = chain.indexOf(slot);
        const j = i + d;
        if (j < 0 || j >= chain.length) return;
        [chain[i], chain[j]] = [chain[j], chain[i]];
        rewire();
      };
      const button = (text, onclick) => Object.assign(document.createElement("button"), { textContent: text, onclick });
      header.append(
        name,
        onLabel,
        button("↑", move(-1)),
        button("↓", move(1)),
        button("✕", () => {
          chain.splice(chain.indexOf(slot), 1);
          fx.output.disconnect();
          fx.dispose();
          rewire();
        }),
      );
      slot.el.append(header);

      for (const p of fx.params) {
        const row = document.createElement("div");
        const label = Object.assign(document.createElement("label"), { textContent: p.label });
        const range = Object.assign(document.createElement("input"), { type: "range", min: p.min, max: p.max, step: p.step, value: p.value });
        const shown = Object.assign(document.createElement("span"), { className: "value", textContent: p.value });
        range.oninput = () => {
          p.set(+range.value);
          shown.textContent = range.value;
        };
        row.append(label, " ", range, " ", shown);
        slot.el.append(row);
      }

      if (fx.code) {
        const examples = document.createElement("select");
        examples.append(new Option("例を読み込む…", ""), ...Object.keys(CODE_EXAMPLES).map((k) => new Option(k, k)));
        const editor = Object.assign(document.createElement("textarea"), { value: fx.code.source, spellcheck: false });
        examples.onchange = () => {
          if (examples.value) editor.value = CODE_EXAMPLES[examples.value];
          examples.value = "";
        };
        const result = document.createElement("div");
        fx.code.onResult = (error) => {
          result.className = error ? "error" : "value";
          result.textContent = error ? `エラー (素通しにしています): ${error}` : "適用しました";
        };
        const save = () => {
          const presetName = prompt("保存する名前", title || "");
          if (!presetName) return;
          const presets = loadPresets();
          presets[presetName] = editor.value;
          savePresets(presets);
          title = presetName;
          name.textContent = presetName;
          fillFxTypes();
        };
        const tools = document.createElement("div");
        tools.append(button("適用", () => fx.code.apply(editor.value)), " ", button("名前をつけて保存", save), " ", examples);
        slot.el.append(editor, tools, result);
      }

      chain.push(slot);
      rewire();
    }

    fillFxTypes();
    $("fxAdd").onclick = () => addEffect($("fxType").value);
  </script>
</body>
</html>
