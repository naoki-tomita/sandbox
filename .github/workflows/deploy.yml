name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'balatro/**'
      - 'fps/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            balatro/package-lock.json
            fps/package-lock.json

      - name: Install Balatro dependencies
        run: npm ci
        working-directory: balatro

      - name: Build Balatro
        run: npm run build
        working-directory: balatro

      - name: Install FPS dependencies
        run: npm ci
        working-directory: fps

      - name: Build FPS
        run: npm run build
        working-directory: fps

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r balatro/dist _site/balatro
          cp -r fps/dist _site/fps

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
