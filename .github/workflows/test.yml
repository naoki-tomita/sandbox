# balatro / canvas-renderer / openworld のユニットテスト (vitest) と atom-watch のテスト (pytest)。
# PR を出したときと、main に push したときに実行する。

name: Test

on:
  pull_request:
    paths:
      - 'balatro/**'
      - 'canvas-renderer/**'
      - 'openworld/**'
      - 'atom-watch/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'balatro/**'
      - 'canvas-renderer/**'
      - 'openworld/**'
      - 'atom-watch/**'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            balatro/package-lock.json
            canvas-renderer/package-lock.json
            openworld/package-lock.json

      - name: Install Balatro dependencies
        run: npm ci
        working-directory: balatro
        env:
          # puppeteer は E2E 検証用の依存。CI のユニットテストでは Chrome 不要
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run Balatro unit tests
        run: npm test
        working-directory: balatro

      - name: Install canvas-renderer dependencies
        run: npm ci
        working-directory: canvas-renderer

      - name: Run canvas-renderer unit tests
        run: npm test
        working-directory: canvas-renderer

      - name: Install openworld dependencies
        run: npm ci
        working-directory: openworld

      - name: Run openworld unit tests
        run: npm test
        working-directory: openworld

      # ワールドデータ（openworld/world/）の検証。AI や人が編集したデータの破綻を検出する
      - name: Validate openworld world data
        run: npm run world:validate -- --strict
        working-directory: openworld

  atom-watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atom-watch
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: atom-watch/uv.lock

      # 物体検出のテストは合成データで後処理だけを検証するので、モデルのダウンロードは不要
      - name: Run atom-watch tests
        run: uv run --locked pytest -q

  # Dockerfile が壊れていないかの確認(ビルドだけ。push はしない)
  atom-watch-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build atom-watch image
        run: docker build -t atom-watch atom-watch
