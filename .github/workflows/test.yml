# balatro のユニットテスト (vitest)。PR と main 押し込みの両方で走る。

name: Test

on:
  pull_request:
    paths:
      - 'balatro/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'balatro/**'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: balatro/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: balatro
        env:
          # puppeteer は E2E 検証用の依存。CI のユニットテストでは Chrome 不要
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run unit tests
        run: npm test
        working-directory: balatro
