[package]
name = "looper"
version = "0.1.0"
description = "Mac/Linux 対応のオーバーダブ型ルーパー"
edition = "2021"
rust-version = "1.77"

[workspace]
members = ["crates/engine"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
engine = { path = "crates/engine" }
cpal = "0.15"
ringbuf = "0.3"
crossbeam-channel = "0.5"

[[bin]]
name = "looper"
path = "src/main.rs"

# 開発ビルドでもオーディオコールバックが重くならないよう最適化しておく。
[profile.dev.package.engine]
opt-level = 2
[profile.dev.package.cpal]
opt-level = 2
